name: Build Random Reward Mod

"on":
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find and extract ZIP
    run: |
      set -eu
      ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Upload ZIP source project ke root repository."
        exit 1
      fi

      mkdir -p project
      unzip -o "$ZIP_FILE" -d project

      PROJECT_DIR=$(find project -type f \
        \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
        -print -quit | xargs -r dirname)

      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle" ]; then
        echo "ERROR: File build.gradle tidak ditemukan."
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Proyek ditemukan di: $PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.1'

  - name: Build mod
    run: |
      cd "$PROJECT_DIR"
      gradle build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: RandomRewardCommandAliases-JAR
      path: project/**/build/libs/*-1.0.0.jar
      if-no-files-found: error
