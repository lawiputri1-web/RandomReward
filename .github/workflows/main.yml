
name: Build RandomReward

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          BUILD_FILE=$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build project
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomReward-build
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
